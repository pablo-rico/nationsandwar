plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '[7.0.59,7.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // NW_PREVIEW=<scenes> ./gradlew runClient -Ppreview : open the dev preview world straight away (see client/dev/DevPreview).
        if (project.hasProperty('preview')) {
            arguments.addAll '--quickPlaySingleplayer', 'nw_preview', '--width', '1280', '--height', '720'
        }
        // ./gradlew runClient -Pjoin=localhost [-Puser=Name] : straight into a server (multiplayer checks with several clients).
        if (project.hasProperty('join')) {
            arguments.addAll '--quickPlayMultiplayer', project.property('join').toString()
        }
        if (project.hasProperty('user')) {
            arguments.addAll '--username', project.property('user').toString()
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.add '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = "https://libraries.minecraft.net"
                metadataSources {
                    artifact()
                    mavenPom()
                }
            }
        }
        filter {
            includeGroup "com.mojang"
        }
    }
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven {
        name = "JourneyMap"
        url = "https://jm.gserv.me/repository/maven-public/"
        content { includeGroup "info.journeymap" }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // JourneyMap: the plugin API to compile compat/journeymap; the mod itself only with -Pjm.
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    if (project.hasProperty('jm')) {
        runtimeOnly "maven.modrinth:journeymap:${journeymap_version}"
    }

    // Xaero's World Map + Minimap publish no API artifact: compile compat/xaero against the mods, run them only with -Pxaero.
    compileOnly "maven.modrinth:xaeros-world-map:${xaero_worldmap_version}"
    compileOnly "maven.modrinth:xaeros-minimap:${xaero_minimap_version}"
    if (project.hasProperty('xaero')) {
        runtimeOnly "maven.modrinth:xaeros-world-map:${xaero_worldmap_version}"
        runtimeOnly "maven.modrinth:xaeros-minimap:${xaero_minimap_version}"
    }

    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    // A resource present both hand-written and generated is a migration mistake.
    duplicatesStrategy = DuplicatesStrategy.FAIL
    exclude '.cache/**'

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}_${minecraft_version}_${mod_version}.jar"

    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": project.name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
